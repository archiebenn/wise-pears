[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "visivox"
version = "0.1.0"
description = "All-pairs visibility analyses on voxel volumes (Amanatides & Woo, C++)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Archie Benn" }]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
gui = ["napari[all]"]

[project.urls]
Repository = "https://github.com/archiebenn/visivox"

[tool.scikit-build]
wheel.packages = ["python/visivox"]
sdist.exclude = ["tests", "development_log.md", "uv-cheatsheet.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
